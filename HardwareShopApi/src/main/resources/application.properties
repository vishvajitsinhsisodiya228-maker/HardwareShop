spring.application.name=HardwareShopApi
server.port=8085

# MySQL (create the empty database first:  CREATE DATABASE hardware_db;)
# Change username/password to match your own MySQL install.
spring.datasource.url=jdbc:mysql://localhost:3306/hardware_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

# Validation: list the failing fields in the 400 response
server.error.include-binding-errors=always
server.error.include-message=always

# Practice-only login for POST / PUT / DELETE (HTTP Basic)
spring.security.user.name=shopadmin
spring.security.user.password=Shop@123
