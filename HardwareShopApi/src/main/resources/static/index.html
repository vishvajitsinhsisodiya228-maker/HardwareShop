<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bharat Hardware Mart</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 760px; padding: 0 1rem; color: #222; }
        h1 { margin-bottom: 0.2rem; }
        p.tag { margin-top: 0; color: #666; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f2f2f2; }
        td.num { text-align: right; }
    </style>
</head>
<body>
    <h1>Bharat Hardware Mart</h1>
    <p class="tag">Tools, paint and plumbing for every site and every home</p>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Price (₹)</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>Claw Hammer 500g</td><td>Tools</td><td class="num">60</td><td class="num">₹320</td></tr>
            <tr><td>Asian Paints Royale 4L</td><td>Paint</td><td class="num">35</td><td class="num">₹2,150</td></tr>
            <tr><td>CPVC Pipe 1 inch</td><td>Plumbing</td><td class="num">120</td><td class="num">₹185</td></tr>
            <tr><td>Cordless Drill 12V</td><td>Tools</td><td class="num">18</td><td class="num">₹2,400</td></tr>
        </tbody>
    </table>
</body>
</html>
